logging.level.root=WARN
logging.level.com.a5solutions=INFO

spring.application.name=lambda-multitenant

# O schema de cada tenant e garantido pelo DatabaseConfig na 1a conexao daquele tenant,
# nao no startup (no startup ainda nao sabemos quais tenants vao chegar).
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# No startup o unico banco disponivel e o H2 de bootstrap: nao deixa o Hibernate inspecionar ele
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false
logging.level.org.hibernate.orm.deprecation=ERROR
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Regiao dos secrets. Em ambiente local, AWS_ENDPOINT_URL aponta o client para o LocalStack.
aws.region=${AWS_REGION:sa-east-1}
aws.endpoint-url=${AWS_ENDPOINT_URL:}
